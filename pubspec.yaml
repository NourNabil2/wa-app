
name: fastway
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # firebase
  firebase_messaging:
  flutter_local_notifications: ^17.2.2

  # State Management
  get_it:
  flutter_bloc:

  # Local Database
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage:

  # UI
  google_fonts: ^6.1.0
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie:
  flutter_slidable:
  flutter_spinkit: ^5.0.0
  custom_refresh_indicator: ^4.0.1
  skeletonizer:
  flutter_animate:

  # Utilities
  intl: ^0.20.0
  easy_localization:
  dartz:
  flutter_screenutil:
  uuid: ^4.2.2
  url_launcher:
  share_plus:
  flutter_widget_from_html_core: ^0.15.2
  webview_flutter:
  syncfusion_flutter_pdfviewer: ^29.1.38
  pdf: ^3.11.1
  printing: ^5.13.0

  # HTTP & API
  dio: ^5.4.0
  telr_mobile_payment_sdk: ^4.4.0 # 4.4.0 adds payWithApplePay (native sheet, merchant-owned button)
  pay: ^3.3.0

  # Authentication
  local_auth: ^2.3.0

  # Charts
  fl_chart: ^0.66.0

  # Maps
  google_maps_flutter: any
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator:
  firebase_core:
  google_places_flutter:


  # Image Picker
  image_picker: ^1.0.7
  equatable: ^2.0.8
  supabase_flutter: ^2.18.3


dev_dependencies:
  pretty_dio_logger:
  change_app_package_name:

  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/icons/payments/
    - assets/icons/shipping/
    - assets/icons/footericons/
    - assets/images/
    - assets/translations/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/font/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Tajawal-Light.ttf
          weight: 300
        - asset: assets/font/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/font/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/font/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/font/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/font/Tajawal-Black.ttf
          weight: 900

    # Custom micro-font (0.7 KB) built from the official Saudi Riyal SVG.
    # Contains a single glyph at U+20C1 (the OFFICIAL Saudi Riyal symbol,
    # Unicode 16.0 2024). Used exclusively by SarText so the symbol renders
    # as a real text glyph with automatic baseline alignment.
    - family: SaudiRiyalSAR
      fonts:
        - asset: assets/font/SaudiRiyalSAR.ttf