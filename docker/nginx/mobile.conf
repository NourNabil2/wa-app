server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ── index.html — NEVER cache (SPA entry point) ───────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── flutter_bootstrap.js — no cache (references busted filenames) ────────
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # ── JS, WASM — long cache (cache-busted by build) ────────────────────────
    location ~* \.(js|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Static assets (fonts, images, icons) — long cache ───────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback: any path that doesn't match a real file → index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/javascript application/json
               text/css application/wasm text/xml image/svg+xml;
    gzip_min_length 1024;
}
