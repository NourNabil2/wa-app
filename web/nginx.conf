##############################################################################
# Nginx config for: fastway-mobile.atwdemo.com (Flutter Web SPA)
#
# KEY rule: try_files ... /index.html
#   → Every path (e.g. /products/123) that doesn't match a static file
#     is served as index.html, letting Flutter's router handle it.
##############################################################################

server {
    listen 80;
    server_name fastway-mobile.atwdemo.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fastway-mobile.atwdemo.com;

    # ── TLS (update paths to match your cert location) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/fastway-mobile.atwdemo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fastway-mobile.atwdemo.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/fastway-mobile/build/web;
    index index.html;

    # ── index.html — NEVER cache (SPA entry point) ───────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── Flutter bootstrap & dart JS — cache-busted by build_web.sh ──────────
    location ~* \.(js|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Static assets (fonts, images, icons) — long cache ───────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback: any path that doesn't match a real file → index.html ──
    # This is what fixes the "refresh → home page" issue.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain application/javascript application/json text/css application/wasm text/xml application/xml;
    gzip_min_length 1024;

    # ── COOP/COEP headers — required for skwasm multi-threading (SharedArrayBuffer) ──
    # Without these the browser falls back to the heavier single-threaded skwasm_heavy.wasm.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
}
